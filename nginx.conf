server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the gateway. Only used when this image is run next to the
    # backend stack: the GitHub Pages deployment never reaches this file, and there the
    # frontend calls the API cross-origin through VITE_API_BASE_URL instead.
    # The upstream used to be called "backend" - that name disappeared when the backend
    # was split into auth-service and gateway.
    location /api/ {
        proxy_pass         http://gateway:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
