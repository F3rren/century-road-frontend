name: Deploy to GitHub Pages

# Neither workflow GitHub suggests fits this repository: the Jekyll one is for Jekyll
# sites, and "Static HTML" deploys files without building, while a Vite app only exists
# as static files after npm run build.

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a cancelled deploy can leave
# the site serving a partially published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Pages serves a project site under /<repo>/, so the assets need that prefix.
          # Derived from the repository name rather than written out, so renaming the
          # repository does not silently break every asset URL.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Set this as a repository variable once the frontend actually calls the API.
          # Pages cannot proxy, so it has to be the backend's absolute public URL.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so opening /dashboard directly - or reloading it -
        # would hit Pages' own 404 page instead of the app. Serving a copy of index.html
        # as 404.html hands those requests to the router, which is the only way to keep
        # deep links working on this host.
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
