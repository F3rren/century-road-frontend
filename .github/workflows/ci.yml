name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # jsdom 30's bundled undici (^8.x) unconditionally requires
      # node:worker_threads.markAsUncloneable, which doesn't exist before
      # Node ~22.10 - on Node 20 every test file crashes at jsdom's own
      # module-load time with "webidl.util.markAsUncloneable is not a
      # function", before any test even runs. 22 is the fix, not pinning
      # jsdom backward or swapping test environments.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The generated types must be what the committed OpenAPI document produces: one updated
      # without the other fails here, instead of compiling against a contract nobody wrote down.
      - name: API types are up to date
        run: npm run api:check

      - name: Type-check and build
        run: npm run build

  # Publishes the production image, built from Dockerfile.railway so that what runs somewhere
  # else is the one this repository already ships. It needs the frontend job to be green, so an
  # image is never published for a commit that failed lint/test/build, and it runs on pushes
  # only: a pull request has nothing to publish yet.
  #
  # It gets the short commit id (immutable, what to pin) and a moving tag: "latest" on the
  # default branch, the branch name on any other.
  publish-image:
    name: Frontend image
    needs: frontend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Declaring permissions at all drops every unlisted scope to none, so contents: read has to
    # be spelled out again or the checkout below loses read access. security-events: write is
    # for the Trivy SARIF upload further down, same as codeql.yml's job permissions.
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR refuses upper case in a name and github.repository keeps whatever the account or
      # the repository was created with, so it is lower-cased here rather than typed.
      - name: Work out image name and tags
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # VITE_API_BASE_URL is baked into the compiled files at build time (see Dockerfile.railway),
      # so it has to be supplied here rather than left for Railway to inject - Railway no longer
      # builds this image, it only pulls the tag a release points at. Set it once as a repository
      # variable (Settings -> Secrets and variables -> Actions -> Variables): the gateway's public
      # URL plus "/api". It is not a secret - it is compiled into the public bundle either way.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.railway
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.sha }}
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the image just pushed, by its immutable commit tag, so what gets scanned is exactly
      # what was published. This is the part `npm audit` (dependency-scan.yml) cannot see: the
      # web server and the operating system the static files are served from. ignore-unfixed is
      # a deliberate policy, as in the backend's CI: a HIGH/CRITICAL CVE with no fix available
      # yet should not keep this job red forever.
      - name: Scan the image for vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The scan above writes SARIF, which nobody can read in this log: the same findings as a
      # table, only when there are any, in the log and in the run's summary page. A second pass over
      # the image costs seconds (the vulnerability database is cached) and never fails the job.
      - name: List the findings as a table
        if: steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.sha }}
          format: table
          output: trivy-frontend.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Show the findings in the log and in the run summary
        if: steps.trivy.outcome == 'failure'
        run: |
          cat trivy-frontend.txt
          {
            echo "### Trivy: fixable HIGH/CRITICAL findings in the frontend image"
            echo '```'
            head -n 300 trivy-frontend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded whether the scan passed or failed, so findings are visible in the Security tab
      # even when the scan reports any - the same tab codeql.yml already publishes to.
      - name: Upload scan results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # Visible, not blocking: a warning annotation on this run, on top of the Security tab
      # entries the upload above created. Failing the job would also fail release.sh's "CI passed
      # for this commit" check, which would hold every release hostage until the scan is clean.
      - name: Warn if the scan found HIGH/CRITICAL vulnerabilities
        if: steps.trivy.outcome == 'failure'
        run: echo "::warning::Trivy found HIGH/CRITICAL vulnerabilities in the frontend image - see the Security tab (category trivy-frontend)"

  # The release script decides what gets published under a version, so it is tested like code.
  # It talks to gh and docker through stand-ins: no network, a few seconds.
  release-script:
    name: release script test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test the release script
        run: bash .github/scripts/release_test.sh
