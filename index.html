<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/source-serif-4-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/oswald-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      The Welcome page's photo filmstrip pulls its images straight from
      Wikimedia (see thirdParties.ts) — a dozen-plus parallel requests to a
      domain the browser has never touched yet. Preconnecting starts the
      DNS/TLS handshake during the entrance sequence instead of on the first
      image request, shaving a round trip off every one of them.
    -->
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://thumb.wikimedia.org" crossorigin />
    <!--
      Real defaults, not placeholders: this is a client-rendered SPA, so a
      non-JS scraper or link-preview bot only ever sees what's static here —
      usePageMeta (src/hooks/usePageMeta.ts) updates both per route for
      everything that does run JS.
    -->
    <title>Century Road — L'archivio della storia, un giorno alla volta</title>
    <meta
      name="description"
      content="Century Road è l'archivio multilingue della storia: scopri gli eventi accaduti oggi nel corso dei secoli su una mappa interattiva, con statistiche e articoli da Wikipedia."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      One static card for every shared link, not a per-page one: this SPA has
      no server-side rendering, and most link-preview bots (unlike Googlebot)
      never execute JS, so they only ever see what's here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Century Road — L'archivio della storia, un giorno alla volta" />
    <meta
      property="og:description"
      content="Century Road è l'archivio multilingue della storia: scopri gli eventi accaduti oggi nel corso dei secoli su una mappa interattiva, con statistiche e articoli da Wikipedia."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applies the persisted/system theme before first paint, so there's
      // no flash of the wrong theme while React mounts and its own effect
      // (which merely reads this back) runs.
      (function () {
        try {
          var stored = localStorage.getItem("century-road-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script>
      // Same pre-paint approach as the theme script above, for the
      // Accessibilità reduced-motion override: applied before first paint so
      // an animation never starts and then gets cut short by React mounting.
      (function () {
        try {
          if (localStorage.getItem("century-road-reduced-motion") === "true") {
            document.documentElement.classList.add("reduce-motion");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
